services:
  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    depends_on:
      - alertmanager
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.28.1
    depends_on:
      - webhook-receiver
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    restart: unless-stopped

  webhook-receiver:
    image: grafana/observability-lab-webhook:0.1.0
    build:
      context: ./alert-receiver
    ports:
      - "127.0.0.1:${WEBHOOK_RECEIVER_PORT:-8090}:8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.0.2
    depends_on:
      - prometheus
      - loki
      - tempo
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-grafana-lab-only-change-me}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.9.1
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/containers/.+)($|/)
    ports:
      - "127.0.0.1:9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    privileged: true
    ports:
      - "127.0.0.1:8085:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    restart: unless-stopped

  postgres:
    image: postgres:17.5-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-observability}
      POSTGRES_USER: ${POSTGRES_USER:-labuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lab-postgres-only-change-me}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  app:
    image: grafana/observability-lab-app:0.2.0
    build:
      context: ./app
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-observability}
      POSTGRES_USER: ${POSTGRES_USER:-labuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lab-postgres-only-change-me}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      CHAOS_ADMIN_TOKEN: ${CHAOS_ADMIN_TOKEN:-local-chaos-token-change-me}
      OTEL_SERVICE_NAME: app
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://tempo:4318/v1/traces
      OTEL_PYTHON_FLASK_EXCLUDED_URLS: health,metrics,chaos
    depends_on:
      postgres:
        condition: service_healthy
      tempo:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  nginx:
    image: nginx:1.29.1-alpine
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.4.2
    command:
      - --nginx.scrape-uri=http://nginx:8081/nginx_status
    depends_on:
      nginx:
        condition: service_healthy
    ports:
      - "127.0.0.1:${NGINX_EXPORTER_PORT:-9113}:9113"
    restart: unless-stopped

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    command:
      - --config.file=/etc/postgres-exporter/config.yml
    environment:
      DATA_SOURCE_URI: "postgres:5432/${POSTGRES_DB:-observability}?sslmode=disable"
      DATA_SOURCE_USER: ${POSTGRES_USER:-labuser}
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD:-lab-postgres-only-change-me}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${POSTGRES_EXPORTER_PORT:-9187}:9187"
    volumes:
      - ./postgres-exporter/config.yml:/etc/postgres-exporter/config.yml:ro
    restart: unless-stopped

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.27.0
    command:
      - --config.file=/etc/blackbox/blackbox.yml
    ports:
      - "127.0.0.1:${BLACKBOX_EXPORTER_PORT:-9115}:9115"
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    restart: unless-stopped

  loki:
    image: grafana/loki:3.5.1
    command:
      - -config.file=/etc/loki/config.yml
    ports:
      - "127.0.0.1:${LOKI_PORT:-3100}:3100"
    volumes:
      - ./loki/config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.8.2
    command:
      - -config.file=/etc/tempo/tempo.yml
    ports:
      - "127.0.0.1:${TEMPO_PORT:-3200}:3200"
    expose:
      - "4317"
      - "4318"
    volumes:
      - ./tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.10.2
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-grafana}
    depends_on:
      - loki
    ports:
      - "127.0.0.1:${ALLOY_PORT:-12345}:12345"
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    restart: unless-stopped

  k6:
    image: grafana/k6:0.55.0
    profiles:
      - traffic
    command:
      - run
      - /scripts/k6-scenarios.js
    environment:
      BASE_URL: http://nginx:8080
      SCENARIO: ${K6_SCENARIO:-steady}
      CHAOS_ADMIN_TOKEN: ${CHAOS_ADMIN_TOKEN:-local-chaos-token-change-me}
    depends_on:
      nginx:
        condition: service_healthy
    volumes:
      - ./scripts:/scripts:ro

volumes:
  prometheus-data:
  grafana-data:
  postgres-data:
  alertmanager-data:
  loki-data:
  alloy-data:
  tempo-data:
